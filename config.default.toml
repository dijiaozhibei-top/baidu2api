# Baidu2API Configuration
# 此文件在容器首次启动时会复制到 /app/data/config.toml（若不存在）

[cookies]
# 可留空：自动获取访客 Cookie
# 若对话失败，可在管理台粘贴浏览器完整 Cookie（建议含 BA_HECTOR / ZFY）
value = ""

# 多 Cookie 池示例：
# values = [
#   "BAIDUID=...; BA_HECTOR=...; ZFY=...",
# ]

[server]
host = "0.0.0.0"
port = 8000

[auth]
# 公网部署建议配置 API Key；留空表示不鉴权
api_keys = []
# 管理台密钥（也可用环境变量 BAIDU2API_ADMIN_KEY 覆盖）
admin_key = "baidu2api"
jwt_expire_hours = 24

[headers]
user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

[cookie_persistence]
cookie_file = "data/cookies.json"
auto_save_cookies = true

[context]
fresh_conversation = true
max_chars = 12000
max_messages = 16
max_message_chars = 2000

[options]
default_model = "deepseek-v4-flash"
stream = true
