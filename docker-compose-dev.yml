services:
  baidu2api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 国内若官方源慢/失败，可在 .env 覆盖，例如：
        # NODE_IMAGE=docker.m.daocloud.io/library/node:22-alpine
        # PYTHON_IMAGE=docker.m.daocloud.io/library/python:3.13-slim
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.13-slim}
    image: baidu2api:dev
    # 不要去 Docker Hub 拉取 baidu2api:dev（该标签默认不存在）
    pull_policy: build
    container_name: baidu2api-dev
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${BAIDU2API_HOST_PORT:-8000}:8000"
    volumes:
      # 配置与 Cookie 都放在宿主机 ./data，容器首次启动会自动创建
      - ./data:/app/data
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - PORT=8000
      - BAIDU2API_ADMIN_KEY=${BAIDU2API_ADMIN_KEY:-baidu2api}
      - BAIDU2API_DATA_DIR=/app/data
      - BAIDU2API_CONFIG_PATH=/app/data/config.toml
      - BAIDU2API_COOKIE_FILE=/app/data/cookies.json
