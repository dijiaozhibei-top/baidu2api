# Baidu2API Configuration
# 不填 cookies 时会自动从 chat.baidu.com 首页获取

[cookies]
# value = "BAIDUID=xxx; BIDUPSID=xxx; ..."
# values = ["...", "..."]
value = ""

[server]
host = "0.0.0.0"
port = 8000

[auth]
# 公网部署建议配置 api_keys；留空表示不鉴权
api_keys = []
# WebUI 管理员密钥（也可用环境变量 BAIDU2API_ADMIN_KEY）
admin_key = "baidu2api"
jwt_expire_hours = 24

[headers]
user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

[cookie_persistence]
cookie_file = "cookies.json"
auto_save_cookies = true

[context]
fresh_conversation = true
max_chars = 12000
max_messages = 16
max_message_chars = 2000

[options]
default_model = "deepseek-v4-flash"
stream = true
