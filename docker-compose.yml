services:
  baidu2api:
    build: .
    image: baidu2api:latest
    container_name: baidu2api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${BAIDU2API_HOST_PORT:-8000}:8000"
    volumes:
      - ./config.toml:/app/config.toml
      - ./cookies.json:/app/cookies.json
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - PORT=8000
      - BAIDU2API_ADMIN_KEY=${BAIDU2API_ADMIN_KEY:-baidu2api}
